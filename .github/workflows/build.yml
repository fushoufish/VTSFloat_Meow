name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S native -B native/build -G "Visual Studio 17 2022" -A x64 -DVTSFLOAT_LANGUAGE_PREVIEW=OFF -DVTSFLOAT_OUTPUT_DIRECTORY="${{ github.workspace }}/artifacts"

      - name: Build
        run: cmake --build native/build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir native/build -C Release --output-on-failure

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: VTSFloat_Meow-unsigned
          path: artifacts/VTSFloat_Meow.exe
          if-no-files-found: error
