name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    outputs:
      release-artifact-id: ${{ steps.release-artifact.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S native -B native/build -G "Visual Studio 17 2022" -A x64 -DVTSFLOAT_LANGUAGE_PREVIEW=OFF -DVTSFLOAT_OUTPUT_DIRECTORY="${{ github.workspace }}/artifacts"

      - name: Build
        run: cmake --build native/build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir native/build -C Release --output-on-failure

      - name: Check the Release tag matches the EXE version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+(\.\d+)?$') {
            Write-Host "Skipping update version validation for $tag."
            exit 0
          }
          $expected = [version]$tag.Substring(1)
          $file = [Diagnostics.FileVersionInfo]::GetVersionInfo(
            (Resolve-Path 'artifacts/VTSFloat_Meow.exe').Path)
          $actual = [version]::new($file.FileMajorPart, $file.FileMinorPart, $file.FileBuildPart)
          $normalized = [version]::new($expected.Major, $expected.Minor, [Math]::Max(0, $expected.Build))
          if ($actual -ne $normalized) {
            throw "Release $tag does not match EXE version $actual. Update native/CMakeLists.txt."
          }

      - name: Upload release artifact
        id: release-artifact
        uses: actions/upload-artifact@v4
        with:
          name: VTSFloat_Meow
          path: artifacts/VTSFloat_Meow.exe
          if-no-files-found: error

  attest:
    if: github.repository == 'fushoufish/VTSFloat_Meow' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the built EXE
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.release-artifact-id }}
          path: artifacts

      - name: Attest EXE build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/VTSFloat_Meow.exe
