name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    outputs:
      release-artifact-id: ${{ steps.release-artifact.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch ANR build headers
        run: |
          $include = Join-Path $env:RUNNER_TEMP 'dlss-include'
          New-Item -ItemType Directory -Force -Path $include | Out-Null
          $source = 'https://raw.githubusercontent.com/NVIDIA/DLSS/9981c6350dc58c0ce21f024fd65e31e851c31689/include'
          $hashes = @{
            'nvsdk_ngx_defs_dlssg.h' = 'c29765ab9e0125f9d724ae9811cc2abe03738d17486ec8eee80d78a1504549e1'
            'nvsdk_ngx_defs.h' = 'ea23f33497cd274860d1c25a97644fce807dcb0037c594547203343103fad03e'
            'nvsdk_ngx_params.h' = '943bc8cc5cdae03b6303016fbad3183636f2335ae27a2d18776798c3b4efabbc'
          }
          foreach ($header in $hashes.Keys) {
            $destination = Join-Path $include $header
            Invoke-WebRequest "$source/$header" -OutFile $destination
            if ((Get-FileHash -LiteralPath $destination).Hash -ne $hashes[$header]) {
              throw "Unexpected SHA-256 for $header"
            }
          }
          "VTSFLOAT_ANR_NGX_INCLUDE=$include" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -S native -B native/build -G "Visual Studio 17 2022" -A x64 -DVTSFLOAT_LANGUAGE_PREVIEW=OFF "-DVTSFLOAT_ANR_NGX_INCLUDE=$env:VTSFLOAT_ANR_NGX_INCLUDE" -DVTSFLOAT_OUTPUT_DIRECTORY="${{ github.workspace }}/artifacts"

      - name: Build
        run: cmake --build native/build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir native/build -C Release --output-on-failure

      - name: Check the Release tag matches the EXE version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+(\.\d+)?$') {
            Write-Host "Skipping update version validation for $tag."
            exit 0
          }
          $expected = [version]$tag.Substring(1)
          $file = [Diagnostics.FileVersionInfo]::GetVersionInfo(
            (Resolve-Path 'artifacts/VTSFloat_Meow.exe').Path)
          $actual = [version]::new($file.FileMajorPart, $file.FileMinorPart, $file.FileBuildPart)
          $normalized = [version]::new($expected.Major, $expected.Minor, [Math]::Max(0, $expected.Build))
          if ($actual -ne $normalized) {
            throw "Release $tag does not match EXE version $actual. Update native/CMakeLists.txt."
          }

      - name: Upload release artifact
        id: release-artifact
        uses: actions/upload-artifact@v4
        with:
          name: VTSFloat_Meow
          path: artifacts/VTSFloat_Meow.exe
          if-no-files-found: error

  attest:
    if: github.repository == 'fushoufish/VTSFloat_Meow' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the built EXE
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.release-artifact-id }}
          path: artifacts

      - name: Attest EXE build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/VTSFloat_Meow.exe
