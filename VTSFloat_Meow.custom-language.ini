; VTSFloat_Meow custom language template
; English is the reference language and the default fallback.
; Keep every T_ key unchanged and edit the text between '=' and ' #'.
; Text after ' #' is an English note and is not displayed.
; Write \# if the translated text itself needs a literal # after a space.
; Use \n for a line break, \s for an edge space, and \\ for a backslash.
; Re-select Custom (INI) in the Language menu to reload this file.

